# PocketBrains — XcodeGen project definition.
# Generate the .xcodeproj with:  xcodegen generate
# (brew install xcodegen)
name: PocketBrains
options:
  bundleIdPrefix: com.pocketbrains
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PocketBrains:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
    info:
      path: Support/Info.plist
      properties:
        # No proprietary encryption — exempt; keeps TestFlight/App Store
        # submissions from prompting for export compliance every build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMotionUsageDescription: "Device motion drives the lighting inside the glass material."
        INFOPLIST_KEY_CFBundleDisplayName: PocketBrains
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "$(inherited)"
        # To enable the optional MLX backend (larger open models on Pro devices):
        #   1. Add the package below under `packages:` and `dependencies:`.
        #   2. Append `-D POCKETBRAINS_MLX` to OTHER_SWIFT_FLAGS.
        # packages:
        #   MLXLibraries:
        #     url: https://github.com/ml-explore/mlx-swift-examples
        #     from: 2.25.0
        # dependencies: [package: MLXLibraries, products: [MLXLLM, MLXLMCommon]]

  PocketBrainsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PocketBrains
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketBrains.app/PocketBrains"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PocketBrains:
    build:
      targets:
        PocketBrains: all
        PocketBrainsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketBrainsTests
