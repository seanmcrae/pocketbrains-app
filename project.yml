# PocketBrains — XcodeGen project definition.
# Generate the .xcodeproj with:  xcodegen generate
# (brew install xcodegen)
name: PocketBrains
options:
  bundleIdPrefix: com.pocketbrains
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.3.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PocketBrains:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        optional: true
    dependencies:
      # Today widget, embedded in the app. Reads a JSON snapshot from the
      # shared App Group container; never opens the database.
      - target: PocketBrainsWidget
    info:
      path: Support/Info.plist
      properties:
        # No proprietary encryption — exempt; keeps TestFlight/App Store
        # submissions from prompting for export compliance every build.
        ITSAppUsesNonExemptEncryption: false
        # Opt-in integrations (Settings → Integrations). Nothing is requested
        # until the user switches one on.
        NSCalendarsFullAccessUsageDescription: "PocketBrains reads your events on this device so briefs and questions like “what's my afternoon look like?” include your meetings. It never edits events or sends them anywhere."
        NSRemindersFullAccessUsageDescription: "PocketBrains adds tasks to Reminders when you ask it to export them, and removes only those reminders if you undo. Nothing leaves this device."
    entitlements:
      path: Support/PocketBrains.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pocketbrains.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMotionUsageDescription: "Device motion drives the lighting inside the glass material."
        INFOPLIST_KEY_CFBundleDisplayName: PocketBrains
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "$(inherited)"
        # To enable the optional MLX backend (larger open models on Pro devices):
        #   1. Add the package below under `packages:` and `dependencies:`.
        #   2. Append `-D POCKETBRAINS_MLX` to OTHER_SWIFT_FLAGS.
        # packages:
        #   MLXLibraries:
        #     url: https://github.com/ml-explore/mlx-swift-examples
        #     from: 2.25.0
        # dependencies: [package: MLXLibraries, products: [MLXLLM, MLXLMCommon]]

  PocketBrainsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: PocketBrains
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/PocketBrainsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pocketbrains.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketBrains
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  PocketBrainsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PocketBrains
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketBrains.app/PocketBrains"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PocketBrains:
    build:
      targets:
        PocketBrains: all
        PocketBrainsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketBrainsTests
