# Only GitHub Actions is tracked. The app has no Package.swift and no
# resolved Swift packages (the optional MLX dependency is commented out in
# project.yml), so there is nothing for the Swift ecosystem to update yet.
# Add a `swift` entry when a Package.swift or Package.resolved is committed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
