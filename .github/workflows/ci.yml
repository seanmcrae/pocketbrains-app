name: CI

# Runs on every push to main, every pull request targeting main (including
# Dependabot's), and on demand. No paths filters: docs-only changes still
# run the hygiene scan, and the iOS job is the only source of eval numbers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for paths, credentials and large binaries
        run: ./scripts/check-hygiene.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs site builds (no CI log, so tables show a notice)
        run: |
          pip install -r docs/site/requirements.txt
          python scripts/build_site.py --out site

  ios:
    name: Build and test (iOS 26 Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Tests run serialized: SwiftData containers and the paced agent streams
      # are MainActor-bound, and parallel suites made crash logs unreadable.
      - name: Build and test
        run: |
          set -o pipefail
          DEVICE="$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -1 | xargs)"
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test \
            -project PocketBrains.xcodeproj \
            -scheme PocketBrains \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # Semantic and hybrid retrieval need the NLEmbedding sentence asset,
      # which the main run never loads (it once destabilized asset-less
      # simulators). Run that eval alone, after the main suite, so an asset
      # problem can only cost these numbers, never the build.
      - name: Embedding eval (semantic and hybrid retrieval)
        continue-on-error: true
        run: |
          set -o pipefail
          TEST_RUNNER_PB_EMBEDDING_EVAL=1 xcodebuild test-without-building \
            -project PocketBrains.xcodeproj \
            -scheme PocketBrains \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -configuration Debug \
            -only-testing:PocketBrainsTests/RAGEval \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-embedding.log

      - name: Summarize results
        if: always()
        run: |
          {
            echo "### iOS test results"
            grep -E 'Test run with [0-9]+ tests' build.log | tail -1 || echo "No Swift Testing summary found."
            echo
            echo "### Intent-router eval"
            echo '```'
            grep -E '^EVAL ' build.log | sed 's/^EVAL //' || echo "Eval output not found."
            echo '```'
            echo
            echo "### Embedding eval (separate step)"
            echo '```'
            grep -E '^EVAL rag' build-embedding.log 2>/dev/null | sed 's/^EVAL //' || echo "Embedding eval did not run or printed nothing."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect simulator crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-log
          path: |
            build.log
            build-embedding.log
            crash-reports/
          if-no-files-found: ignore
