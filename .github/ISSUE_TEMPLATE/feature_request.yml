name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: The job you are trying to get done
      description: Describe the situation and the outcome you want, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without sending data off the device
