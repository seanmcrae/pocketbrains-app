{% extends "base.html" %}
{% block main %}
<div class="wrap with-toc">
  <aside class="toc">
    <p class="toc-title">{{ heading }}</p>
    <ul>{% for item in toc %}<li><a href="#{{ item.id }}">{{ item.name }}</a></li>{% endfor %}</ul>
  </aside>
  <article class="prose">
    <h1>{{ heading }}</h1>
    {{ body | safe }}
  </article>
</div>
{% endblock %}
